<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#efeae2">
  <title>할 일</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header class="top">
      <div class="brand">
        <span class="logo" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="22" height="22">
            <rect x="4" y="6" width="24" height="22" rx="4" fill="none" stroke="currentColor" stroke-width="2"></rect>
            <path d="M4 13h24M11 4v5M21 4v5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
          </svg>
        </span>
        <div>
          <h1>할 일</h1>
          <p class="tagline">이 브라우저에만 저장됩니다</p>
        </div>
      </div>
      <div class="views" role="group" aria-label="보기 방식">
        <button type="button" data-action="set-view" data-view="day">일별</button>
        <button type="button" data-action="set-view" data-view="week">주별</button>
        <button type="button" data-action="set-view" data-view="month">월별</button>
      </div>
    </header>

    <div class="toolbar">
      <div class="nav">
        <button type="button" class="btn" id="prev-btn" data-action="prev">이전 달</button>
        <button type="button" class="btn btn-today" data-action="today">오늘</button>
        <button type="button" class="btn" id="next-btn" data-action="next">다음 달</button>
      </div>
      <h2 id="period"></h2>
      <p id="summary" class="summary"></p>
    </div>

    <main class="layout" id="layout">
      <section id="board" aria-label="월간 달력"></section>
      <aside id="panel" aria-label="선택한 날짜의 할 일"></aside>
    </main>

    <p id="status" class="visually-hidden" aria-live="polite"></p>
    <footer class="footnote">할 일은 이 브라우저의 localStorage에 저장됩니다. 다른 기기나 브라우저와는 공유되지 않습니다.</footer>
  </div>
  <noscript>
    <p>할 일을 사용하려면 JavaScript를 켜 주세요.</p>
  </noscript>
  <script src="app.js"></script>
</body>
</html>
